<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Kawasaki Ninja H2R — Neon Lily Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --green:#00ff88;
      --red:#ff1166;
      --deep:#030309;
      --steel:#8fa0b0;
      --white:#f0f4f8;
      --gold:#c9a84c;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow-x:hidden;
      scroll-behavior:smooth;
      background:#020208;
      font-family:'Cormorant Garamond',serif;
      color:white;
    }

    #canvas-container{
      position:fixed;
      inset:0;
      z-index:0;
    }

    canvas{
      display:block;
      width:100%!important;
      height:100%!important;
    }

    #overlay{
      position:fixed;
      inset:0;
      background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,.7));
      pointer-events:none;
      z-index:2;
    }

    #title{
      position:fixed;
      top:40px;
      left:50%;
      transform:translateX(-50%);
      z-index:5;
      text-align:center;
    }

    #title h1{
      font-family:'Bebas Neue',sans-serif;
      font-size:clamp(3rem,8vw,7rem);
      letter-spacing:.12em;
      line-height:.9;
    }

    #title h1 span{
      color:#ff2a8a;
    }

    #title p{
      font-family:'Cinzel',serif;
      letter-spacing:.4em;
      color:#9bb0c0;
      font-size:.7rem;
      margin-top:10px;
      text-transform:uppercase;
    }

    #scroll-space{
      position:relative;
      z-index:3;
      height:500vh;
    }
  </style>

</head>
<body>

<div id="canvas-container"></div>
<div id="overlay"></div>

<div id="title">
  <h1>KAWASAKI<br><span>H2R</span></h1>
  <p>Neon Lily Performance Edition</p>
</div>

<div id="scroll-space"></div>

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const isMobile = innerWidth < 768;

/* RENDERER */

const renderer = new THREE.WebGLRenderer({
  antialias:!isMobile,
  powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(isMobile ? 1.2 : 1.6);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = false;
renderer.sortObjects = false;

document
  .getElementById('canvas-container')
  .appendChild(renderer.domElement);

/* SCENE */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030309);

scene.fog = new THREE.FogExp2(
  0x05080f,
  isMobile ? 0.014 : 0.010
);

/* CAMERA */

const camera = new THREE.PerspectiveCamera(
  isMobile ? 65 : 50,
  innerWidth/innerHeight,
  0.01,
  300
);

camera.position.set(0,1.4,5.5);

/* ENVIRONMENT */

const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(),0.04).texture;
scene.environment = envMap;

/* LIGHTS */

scene.add(new THREE.AmbientLight(0xffffff,1.0));

const keyLight = new THREE.DirectionalLight(0xffffff,2.2);
keyLight.position.set(5,8,7);
scene.add(keyLight);

const fill = new THREE.DirectionalLight(0xff2288,1.2);
fill.position.set(-5,3,4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x66aaff,1.3);
rim.position.set(0,5,-5);
scene.add(rim);

const glow = new THREE.PointLight(0xff1166,2.2,10);
glow.position.set(0,-0.3,1);
scene.add(glow);

const topSpot = new THREE.SpotLight(
  0xffffff,
  3.2,
  14,
  Math.PI/4,
  0.6,
  1.5
);

topSpot.position.set(0,7,0);
scene.add(topSpot);

/* GROUND */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({
    color:0x050505,
    roughness:1,
    metalness:0
  })
);

ground.rotation.x = -Math.PI/2;
ground.position.y = -1.05;
scene.add(ground);

/* LILY FIELD */

const lilyGroup = new THREE.Group();
scene.add(lilyGroup);

const lilyCount = isMobile ? 160 : 420;

const lilyGeo = new THREE.PlaneGeometry(0.55,0.55);

const lilies = [];

for(let i=0;i<lilyCount;i++){

  const hue = 0.88 + Math.random()*0.1;
  const sat = 1;
  const light = 0.55 + Math.random()*0.22;

  const mat = new THREE.MeshBasicMaterial({
    color:new THREE.Color().setHSL(hue,sat,light),
    transparent:true,
    opacity:0.96,
    side:THREE.DoubleSide,
    depthWrite:false,
    blending:THREE.AdditiveBlending
  });

  const lily = new THREE.Mesh(lilyGeo,mat);

  const clusterRadius = 9;

  const angle = Math.random()*Math.PI*2;
  const radius = Math.pow(Math.random(),0.45)*clusterRadius;

  lily.position.set(
    Math.cos(angle)*radius + (Math.random()-0.5)*1.4,
    -0.75 + Math.random()*0.35,
    Math.sin(angle)*radius + (Math.random()-0.5)*1.4
  );

  lily.rotation.set(
    Math.random()*Math.PI,
    Math.random()*Math.PI,
    Math.random()*Math.PI
  );

  const scale = 0.4 + Math.random()*1.2;
  lily.scale.setScalar(scale);

  lilies.push({
    mesh:lily,
    speed:0.2 + Math.random()*0.8,
    offset:Math.random()*Math.PI*2
  });

  lilyGroup.add(lily);
}

/* MODEL */

const draco = new DRACOLoader();
draco.setDecoderPath(
  'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/'
);

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let bike = null;

loader.load(
  'kawasaki-ninja-h2r-super-bike.glb',

  gltf=>{

    bike = gltf.scene;

    const box = new THREE.Box3().setFromObject(bike);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    const scale = 3.4 / Math.max(size.x,size.y,size.z);

    bike.scale.setScalar(scale);

    bike.position.set(
      -center.x * scale,
      -1.05,
      -center.z * scale
    );

    bike.traverse(c=>{

      c.frustumCulled = true;

      if(!c.isMesh) return;

      const mats = Array.isArray(c.material)
        ? c.material
        : [c.material];

      mats.forEach(m=>{

        if(!m) return;

        m.envMapIntensity = 0.3;

        if('metalness' in m){
          m.metalness = Math.min(m.metalness || 0,0.25);
        }

        if('roughness' in m){
          m.roughness = Math.max(m.roughness || 0.5,0.65);
        }

        if(m.color){
          const lum =
            m.color.r*0.3 +
            m.color.g*0.59 +
            m.color.b*0.11;

          if(lum < 0.05){
            m.color.setHex(0x050505);
          }
        }

        m.needsUpdate = true;
      });
    });

    scene.add(bike);
  }
);

/* SCROLL */

let rawScroll = 0;
let smoothScroll = 0;

window.addEventListener('scroll',()=>{

  const max = document.body.scrollHeight - innerHeight;

  rawScroll = scrollY / max;

});

/* CAMERA KEYFRAMES */

const keys = [
  {p:0,pos:new THREE.Vector3(0,1.4,5.5)},
  {p:.2,pos:new THREE.Vector3(3,1.1,4)},
  {p:.4,pos:new THREE.Vector3(5,1,0)},
  {p:.6,pos:new THREE.Vector3(2,2,-4)},
  {p:.8,pos:new THREE.Vector3(-3,1,3)},
  {p:1,pos:new THREE.Vector3(0,1.4,5.5)}
];

function updateCamera(progress){

  let a = keys[0];
  let b = keys[1];

  for(let i=0;i<keys.length-1;i++){

    if(progress >= keys[i].p && progress <= keys[i+1].p){
      a = keys[i];
      b = keys[i+1];
      break;
    }
  }

  const t = (progress - a.p)/(b.p-a.p);

  camera.position.lerpVectors(a.pos,b.pos,t);

  camera.lookAt(0,.4,0);
}

/* ANIMATION */

const clock = new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  const ease = isMobile ? 0.18 : 0.11;

  smoothScroll += (rawScroll - smoothScroll) * ease;

  updateCamera(smoothScroll);

  glow.intensity = 2 + Math.sin(t*2)*0.35;

  for(let i=0;i<lilies.length;i++){

    const l = lilies[i];

    l.mesh.rotation.z += 0.0015 * l.speed;

    l.mesh.position.y +=
      Math.sin(t*l.speed+l.offset)*0.0009;
  }

  if(bike){

    bike.rotation.y = Math.sin(t*0.4)*0.08;
  }

  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{

  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
